name: iOS Build and Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-render:
    runs-on: xcode-27
    timeout-minutes: 20

    env:
      PROJECT: PersonalFitnessNative.xcodeproj
      SCHEME: PersonalFitnessNative
      DERIVED_DATA: DerivedData
      BUNDLE_ID: com.bhavishyatr.personalfitnessnative

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        shell: bash
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Test performance analytics
        run: |
          swiftc PersonalFitnessNative/Features/Performance/PerformanceModels.swift Tests/PerformanceMathTests.swift -o /tmp/performance-tests
          /tmp/performance-tests

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate generated project
        run: xcodebuild -list -project "$PROJECT"

      - name: Choose an iPhone Simulator
        shell: bash
        run: |
          DEVICE_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json
          import re
          import sys

          devices = json.load(sys.stdin)["devices"]

          def runtime_version(runtime):
              match = re.search(r"iOS-(\d+(?:-\d+)*)$", runtime)
              if not match:
                  return ()
              return tuple(int(part) for part in match.group(1).split("-"))

          runtimes = sorted(
              (runtime for runtime in devices if runtime_version(runtime)),
              key=runtime_version,
              reverse=True,
          )

          for runtime in runtimes:
              iphones = [
                  device
                  for device in devices[runtime]
                  if device.get("isAvailable", True)
                  and device["name"].startswith("iPhone")
              ]
              if iphones:
                  print(iphones[0]["udid"])
                  break
          else:
              raise SystemExit("No available iPhone simulator found")
          ')"

          echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"

      - name: Build for iPhone Simulator
        shell: bash
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -configuration Debug \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch app and capture iPhone screenshots
        shell: bash
        run: |
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/PersonalFitnessNative.app"

          swiftc Tests/VerifyScreenshot.swift -o /tmp/verify-screenshot
          mkdir -p screenshots
          for tab in overview running strength history; do
            xcrun simctl terminate "$DEVICE_UDID" "$BUNDLE_ID" || true
            xcrun simctl launch "$DEVICE_UDID" "$BUNDLE_ID" --ui-snapshot "--snapshot-$tab"
            verified=false
            for attempt in 1 2 3 4 5 6; do
              sleep 5
              xcrun simctl io "$DEVICE_UDID" screenshot "screenshots/personal-fitness-$tab.png"
              if /tmp/verify-screenshot "screenshots/personal-fitness-$tab.png" "$tab"; then
                verified=true
                break
              fi
            done
            if [[ "$verified" != true ]]; then
              echo "Expected $tab page did not render after six attempts"
              exit 1
            fi
          done

      - name: Upload rendered iPhone screenshots
        uses: actions/upload-artifact@v7
        with:
          name: iphone-render
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Shut down simulator
        if: always()
        shell: bash
        run: |
          if [[ -n "${DEVICE_UDID:-}" ]]; then
            xcrun simctl shutdown "$DEVICE_UDID" || true
          fi
